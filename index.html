<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои задачи</title>
  <style>
    html, body {
      background: linear-gradient(180deg, #fafafa 0%, #f0f0f2 100%);
      color: #111;
      color-scheme: light;
    }

    html {
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.4;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 20px;
    }

    .add-form {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .add-form input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      background: #fff;
      font: inherit;
    }

    .add-form input:focus {
      outline: 2px solid #6c5ce7;
      outline-offset: 1px;
    }

    .add-form button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .add-form button:hover {
      background: #5b4cdb;
    }

    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
    }

    .task-count {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .sort-menu {
      position: relative;
    }

    .sort-toggle {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #f3f3f5;
      color: #333;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .sort-toggle:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .sort-options {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      margin: 0;
      padding: 8px;
      list-style: none;
      min-width: 260px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(17, 17, 17, 0.06);
      z-index: 1;
    }

    .sort-options button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #333;
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }

    .sort-options button:hover,
    .sort-options button[aria-pressed="true"] {
      background: #f3f3f5;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(17, 17, 17, 0.06);
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6c5ce7;
      flex-shrink: 0;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #666;
    }

    .task-text {
      flex: 1;
    }

    .task-item button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #f3f3f5;
      color: #333;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Мои задачи</h1>
  <form class="add-form" id="add-form">
    <input type="text" id="task-input" placeholder="Новая задача">
    <button type="submit">Добавить</button>
  </form>
  <div class="list-toolbar">
    <p class="task-count" id="task-count">0 из 0 выполнено</p>
    <div class="sort-menu">
      <button type="button" class="sort-toggle" id="sort-toggle" disabled>Упорядочить</button>
      <ul class="sort-options" id="sort-options" hidden>
        <li>
          <button type="button" data-sort="az">Сортировать по алфавиту А-Я</button>
        </li>
        <li>
          <button type="button" data-sort="za">Сортировать по алфавиту Я-А</button>
        </li>
      </ul>
    </div>
  </div>
  <ul class="task-list" id="task-list"></ul>

  <script>
    const STORAGE_KEY = "todo-tasks";
    const SORT_KEY = "todo-sort";
    const form = document.getElementById("add-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");
    const count = document.getElementById("task-count");
    const sortToggle = document.getElementById("sort-toggle");
    const sortOptions = document.getElementById("sort-options");
    let sortMode = null;

    function readTasks() {
      return Array.from(list.querySelectorAll(".task-item")).map(function (item) {
        return {
          text: item.querySelector(".task-text").textContent,
          done: item.querySelector("input[type='checkbox']").checked
        };
      });
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(readTasks()));
    }

    function saveSort() {
      if (sortMode === "az" || sortMode === "za") {
        localStorage.setItem(SORT_KEY, sortMode);
      } else {
        localStorage.removeItem(SORT_KEY);
      }
    }

    function loadSort() {
      const value = localStorage.getItem(SORT_KEY);
      sortMode = value === "az" || value === "za" ? value : null;
      updateSortOptionState();
    }

    function compareText(a, b) {
      return a.localeCompare(b, "ru", { sensitivity: "base" });
    }

    function insertItem(item, text) {
      if (!sortMode) {
        list.append(item);
        return;
      }

      const items = list.querySelectorAll(".task-item");
      for (let i = 0; i < items.length; i++) {
        const existingText = items[i].querySelector(".task-text").textContent;
        const cmp = compareText(text, existingText);
        if (sortMode === "az" ? cmp < 0 : cmp > 0) {
          list.insertBefore(item, items[i]);
          return;
        }
      }

      list.append(item);
    }

    function updateSortOptionState() {
      Array.from(sortOptions.querySelectorAll("button[data-sort]")).forEach(function (button) {
        button.setAttribute("aria-pressed", button.getAttribute("data-sort") === sortMode ? "true" : "false");
      });
    }

    function applySort(mode) {
      sortMode = mode;
      const items = Array.from(list.querySelectorAll(".task-item"));
      items.sort(function (a, b) {
        const cmp = compareText(
          a.querySelector(".task-text").textContent,
          b.querySelector(".task-text").textContent
        );
        return mode === "az" ? cmp : -cmp;
      });
      items.forEach(function (item) {
        list.append(item);
      });
      updateSortOptionState();
      saveSort();
      saveTasks();
      sortOptions.hidden = true;
    }

    function updateCount() {
      const tasks = readTasks();
      const done = tasks.filter(function (task) {
        return task.done;
      }).length;
      count.textContent = done + " из " + tasks.length + " выполнено";
      sortToggle.disabled = tasks.length === 0;
      if (tasks.length === 0) {
        sortOptions.hidden = true;
      }
    }

    function addTask(text, done) {
      const item = document.createElement("li");
      item.className = "task-item" + (done ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = done;

      const label = document.createElement("span");
      label.className = "task-text";
      label.textContent = text;

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.textContent = "Удалить";
      removeButton.hidden = !done;

      checkbox.addEventListener("change", function () {
        item.classList.toggle("done", checkbox.checked);
        removeButton.hidden = !checkbox.checked;
        saveTasks();
        updateCount();
      });

      removeButton.addEventListener("click", function () {
        item.remove();
        saveTasks();
        updateCount();
      });

      item.append(checkbox, label, removeButton);
      insertItem(item, text);
      updateCount();
    }

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        updateCount();
        return;
      }

      try {
        const tasks = JSON.parse(raw);
        if (!Array.isArray(tasks)) {
          updateCount();
          return;
        }
        tasks.forEach(function (task) {
          if (!task || typeof task.text !== "string") {
            return;
          }
          const text = task.text.trim();
          if (!text) {
            return;
          }
          addTask(text, Boolean(task.done));
        });
      } catch (error) {
        updateCount();
        return;
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        return;
      }

      addTask(text, false);
      saveTasks();
      input.value = "";
      input.focus();
    });

    sortToggle.addEventListener("click", function () {
      if (sortToggle.disabled) {
        return;
      }
      sortOptions.hidden = !sortOptions.hidden;
    });

    sortOptions.addEventListener("click", function (event) {
      const button = event.target.closest("button[data-sort]");
      if (!button) {
        return;
      }
      applySort(button.getAttribute("data-sort"));
    });

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".sort-menu")) {
        sortOptions.hidden = true;
      }
    });

    loadSort();
    loadTasks();
  </script>
</body>
</html>
