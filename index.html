<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои задачи</title>
  <style>
    html, body {
      background: #fff;
      color: #111;
      color-scheme: light;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
    }

    h1 {
      margin-bottom: 16px;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-form input {
      flex: 1;
      padding: 8px;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #666;
    }

    .task-text {
      flex: 1;
    }
  </style>
</head>
<body>
  <h1>Мои задачи</h1>
  <form class="add-form" id="add-form">
    <input type="text" id="task-input" placeholder="Новая задача">
    <button type="submit">Добавить</button>
  </form>
  <ul class="task-list" id="task-list"></ul>

  <script>
    const STORAGE_KEY = "todo-tasks";
    const form = document.getElementById("add-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");

    function readTasks() {
      return Array.from(list.querySelectorAll(".task-item")).map(function (item) {
        return {
          text: item.querySelector(".task-text").textContent,
          done: item.querySelector("input[type='checkbox']").checked
        };
      });
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(readTasks()));
    }

    function addTask(text, done) {
      const item = document.createElement("li");
      item.className = "task-item" + (done ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = done;

      const label = document.createElement("span");
      label.className = "task-text";
      label.textContent = text;

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.textContent = "Удалить";
      removeButton.hidden = !done;

      checkbox.addEventListener("change", function () {
        item.classList.toggle("done", checkbox.checked);
        removeButton.hidden = !checkbox.checked;
        saveTasks();
      });

      removeButton.addEventListener("click", function () {
        item.remove();
        saveTasks();
      });

      item.append(checkbox, label, removeButton);
      list.append(item);
    }

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return;
      }

      try {
        const tasks = JSON.parse(raw);
        if (!Array.isArray(tasks)) {
          return;
        }
        tasks.forEach(function (task) {
          if (!task || typeof task.text !== "string") {
            return;
          }
          const text = task.text.trim();
          if (!text) {
            return;
          }
          addTask(text, Boolean(task.done));
        });
      } catch (error) {
        return;
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        return;
      }

      addTask(text, false);
      saveTasks();
      input.value = "";
      input.focus();
    });

    loadTasks();
  </script>
</body>
</html>
